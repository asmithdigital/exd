<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team sign-in — EXD</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div style="margin-bottom:2rem;">
        <p style="font-weight:700; font-size:1.1rem; letter-spacing:.12em; color:#111827; margin:0 0 .35rem;">EXD</p>
        <p style="font-size:.875rem; color:#6B7280; margin:0;">Team sign-in — for EXD staff only.</p>
      </div>

      <form id="loginForm" style="display:flex; flex-direction:column; gap:1rem;">
        <div>
          <label class="login-label">Email address</label>
          <input type="email" class="login-input" placeholder="you@exd.co" value="team@exd.co">
        </div>
        <div>
          <label class="login-label">Password</label>
          <input type="password" class="login-input" placeholder="••••••••" value="password">
        </div>
        <button type="submit" style="margin-top:.5rem; width:100%; padding:.8rem; background:#E8522A; color:#fff; border:none; border-radius:7px; font-weight:700; font-size:.9rem;">
          Sign in
        </button>
      </form>

      <div style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid #F3F4F6;">
        <a href="../" style="font-size:.8rem; color:#9CA3AF;">← Back to EXD.co</a>
      </div>
    </div>
    <p style="margin-top:1.5rem; font-size:.75rem; color:#9CA3AF;">This is the EXD team portal. Not a client-facing page.</p>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      doLogin();
      window.location.href = 'pipeline.html';
    });
  </script>
</body>
</html>
