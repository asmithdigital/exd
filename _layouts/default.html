<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — EXD{% else %}EXD — Experience Design Practice{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <div id="toast"></div>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <div class="sticky-cta" id="stickyCta"><a href="{{ '/start-a-project/' | relative_url }}" class="btn btn-primary">Let's talk</a></div>
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
